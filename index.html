<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    // Using CORS proxy to bypass restrictions
    const originalSrc = "https://716f898c7b71.entrypoint.cloud.wowza.com/app-8F9K44lJ/304679fe_stream2/playlist.m3u8";
    const src = "https://corsproxy.io/?" + encodeURIComponent(originalSrc);
    
    if (Hls.isSupported()) {
      const hls = new Hls({
        lowLatencyMode: true,
        xhrSetup: function(xhr, url) {
          // Ensure credentials aren't sent with proxy
          xhr.withCredentials = false;
        }
      });
      
      hls.loadSource(src);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
      });
      
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.play();
    }
  </script>
</body>
</html>
