<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* ✅ disable scrolling */
      background: black;
    }

    video {
      display: block; /* ✅ remove inline gap that causes scroll */
    }
  </style>
</head>

<body>

<video
  id="video"
  controls
  muted
  playsinline
  style="width:100%;height:auto;background:black">
</video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById("video");
  const btn = document.getElementById("play");
  const src = "https://716f898c7b71.entrypoint.cloud.wowza.com/app-8F9K44lJ/304679fe_stream2/playlist.m3u8";

  if (Hls.isSupported()) {
    const hls = new Hls({
      lowLatencyMode: true
    });
    hls.loadSource(src);
    hls.attachMedia(video);
    video.play();
  } else {
    video.src = src;
    video.play();
  }
</script>

</body>
