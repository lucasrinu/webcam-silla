<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
    video::-webkit-media-controls-mute-button {
      display: none;
    }
    video::-webkit-media-controls-volume-slider {
      display: none;
    }
    
    #speedControls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
    }
    .speedBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      margin: 3px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace;
    }
    .speedBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .speedBtn.active {
      background: rgba(0, 150, 255, 0.8);
      border-color: rgba(0, 150, 255, 1);
    }
    #streamInfo {
      color: rgba(255, 255, 255, 0.7);
      font-family: monospace;
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.4;
    }
    #speedLabel {
      color: white;
      font-family: monospace;
      margin-bottom: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="speedControls">
    <div id="speedLabel">Timelapse Speed</div>
    <div id="streamInfo"></div>
  </div>
  
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const speedControls = document.getElementById("speedControls");
    const speedLabel = document.getElementById("speedLabel");
    const streamInfo = document.getElementById("streamInfo");
    const src = "https://customer-rhnwzxvb3mg4wz3v.cloudflarestream.com/9670db1ec306039c0abc79ec5feb3e36/manifest/video.m3u8?parentOrigin=https%3A%2F%2Fcloudflare.tv";
    
    const speeds = [0.25, 0.5, 1, 2, 5, 10, 100, 500, 1000];
    let currentSpeed = 1;
    let timelapseInterval = null;
    let hls;
    let retryCount = 0;
    const maxRetries = 3;
    let isLive = false;
    
    speeds.forEach(speed => {
      const btn = document.createElement('button');
      btn.className = 'speedBtn';
      btn.textContent = speed + 'x';
      btn.onclick = () => setSpeed(speed, btn);
      if (speed === 1) btn.classList.add('active');
      speedControls.appendChild(btn);
    });
    
    function updateStreamInfo() {
      const duration = video.duration;
      const buffered = video.buffered;
      
      if (duration === Infinity) {
        isLive = true;
        
        // Get seekable range for live streams
        if (video.seekable.length > 0) {
          const seekStart = video.seekable.start(0);
          const seekEnd = video.seekable.end(0);
          const dvrWindow = seekEnd - seekStart;
          
          streamInfo.innerHTML = `
            LIVE STREAM<br>
            DVR: ${Math.floor(dvrWindow / 60)}m ${Math.floor(dvrWindow % 60)}s available<br>
            Position: ${formatTime(video.currentTime - seekStart)} / ${formatTime(dvrWindow)}
          `;
        } else {
          streamInfo.innerHTML = 'LIVE STREAM<br>No DVR available';
        }
      } else {
        isLive = false;
        streamInfo.innerHTML = `
          VOD (${formatTime(duration)})<br>
          Position: ${formatTime(video.currentTime)}
        `;
      }
    }
    
    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    }
    
    function setSpeed(speed, clickedBtn) {
      currentSpeed = speed;
      
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
      
      if (speed <= 16) {
        video.playbackRate = speed;
      } else {
        video.playbackRate = 1;
        const skipAmount = speed / 30;
        
        timelapseInterval = setInterval(() => {
          if (!video.paused && !video.ended) {
            const newTime = video.currentTime + skipAmount;
            
            // For live streams, don't seek beyond the seekable range
            if (isLive && video.seekable.length > 0) {
              const maxSeek = video.seekable.end(0) - 2; // Stay 2s behind live edge
              video.currentTime = Math.min(newTime, maxSeek);
            } else {
              video.currentTime = newTime;
            }
          }
        }, 1000 / 30);
      }
      
      document.querySelectorAll('.speedBtn').forEach(btn => {
        btn.classList.remove('active');
      });
      clickedBtn.classList.add('active');
      
      speedLabel.textContent = speed <= 16 
        ? `Speed: ${speed}x (native)` 
        : `Timelapse: ${speed}x (skip frames)`;
    }
    
    function startStream() {
      if (Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          manifestLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 30000,
          enableWorker: true,
          liveSyncDurationCount: 3, // How far behind live edge to stay
          liveMaxLatencyDurationCount: 10
        });
        
        hls.loadSource(src);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.volume = 0;
          video.play().catch(err => console.error("Play failed:", err));
          updateStreamInfo();
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS Error:", data.type, data.details);
          
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < maxRetries) {
              retryCount++;
              setTimeout(() => {
                hls.destroy();
                startStream();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            }
          }
        });
        
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.muted = true;
        video.volume = 0;
        video.play().catch(err => console.error("Play error:", err));
      }
    }
    
    // Update info periodically
    setInterval(updateStreamInfo, 1000);
    
    // Prevent seeking to unavailable content
    video.addEventListener('seeking', () => {
      if (isLive && video.seekable.length > 0) {
        const seekStart = video.seekable.start(0);
        const seekEnd = video.seekable.end(0);
        
        // Clamp seek position to available range
        if (video.currentTime < seekStart) {
          video.currentTime = seekStart;
        } else if (video.currentTime > seekEnd - 1) {
          video.currentTime = seekEnd - 1;
        }
      }
    });
    
    video.addEventListener('volumechange', () => {
      if (!video.muted) video.muted = true;
      if (video.volume > 0) video.volume = 0;
    });
    
    video.addEventListener('pause', () => {
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
    });
    
    video.addEventListener('play', () => {
      if (currentSpeed > 16 && !timelapseInterval) {
        setSpeed(currentSpeed, document.querySelector('.speedBtn.active'));
      }
    });
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startStream);
    } else {
      startStream();
    }
  </script>
</body>
</html>
