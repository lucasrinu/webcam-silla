<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Hide volume controls */
    video::-webkit-media-controls-mute-button {
      display: none;
    }
    video::-webkit-media-controls-volume-slider {
      display: none;
    }
  </style>
</head>
<body>
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const src = "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8";
    let hls;
    let retryCount = 0;
    const maxRetries = 3;
    
    function startStream() {
      if (Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          manifestLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 30000,
          enableWorker: true
        });
        
        hls.loadSource(src);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true; // Force mute
          video.volume = 0; // Set volume to 0
          video.play().catch(err => console.error("Play failed:", err));
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS Error:", data.type, data.details);
          
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < maxRetries) {
              console.log("Network error, retrying... (" + (retryCount + 1) + "/" + maxRetries + ")");
              retryCount++;
              setTimeout(() => {
                hls.destroy();
                startStream();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              console.log("Media error, attempting recovery");
              hls.recoverMediaError();
            }
          }
        });
        
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.muted = true;
        video.volume = 0;
        video.play().catch(err => console.error("Play error:", err));
      }
    }
    
    // Prevent unmuting
    video.addEventListener('volumechange', () => {
      if (!video.muted) {
        video.muted = true;
      }
      if (video.volume > 0) {
        video.volume = 0;
      }
    });
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startStream);
    } else {
      startStream();
    }
  </script>
</body>
</html>
