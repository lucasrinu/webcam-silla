<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
    video::-webkit-media-controls-mute-button {
      display: none;
    }
    video::-webkit-media-controls-volume-slider {
      display: none;
    }
    
    #speedControls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
    }
    .speedBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      margin: 3px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace;
    }
    .speedBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .speedBtn.active {
      background: rgba(0, 150, 255, 0.8);
      border-color: rgba(0, 150, 255, 1);
    }
    #speedLabel {
      color: white;
      font-family: monospace;
      margin-bottom: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="speedControls">
    <div id="speedLabel">Timelapse Speed</div>
  </div>
  
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const speedControls = document.getElementById("speedControls");
    const speedLabel = document.getElementById("speedLabel");
    const src = "https://customer-rhnwzxvb3mg4wz3v.cloudflarestream.com/9670db1ec306039c0abc79ec5feb3e36/manifest/video.m3u8?parentOrigin=https%3A%2F%2Fcloudflare.tv";
    
    // For speeds <=16, use native playbackRate. For higher, skip frames manually
    const speeds = [0.25, 0.5, 1, 2, 5, 10, 100, 500, 1000];
    let currentSpeed = 1;
    let timelapseInterval = null;
    let hls;
    let retryCount = 0;
    const maxRetries = 3;
    
    speeds.forEach(speed => {
      const btn = document.createElement('button');
      btn.className = 'speedBtn';
      btn.textContent = speed + 'x';
      btn.onclick = () => setSpeed(speed, btn);
      if (speed === 1) btn.classList.add('active');
      speedControls.appendChild(btn);
    });
    
    function setSpeed(speed, clickedBtn) {
      currentSpeed = speed;
      
      // Clear any existing timelapse
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
      
      if (speed <= 16) {
        // Use native playback rate for speeds browser supports
        video.playbackRate = speed;
      } else {
        // For high speeds, manually skip frames
        video.playbackRate = 1;
        
        // Calculate how much to skip based on desired speed
        // At 30fps, skip 'speed' frames worth of time each frame
        const skipAmount = speed / 30; // seconds to skip per update
        
        timelapseInterval = setInterval(() => {
          if (!video.paused && !video.ended) {
            video.currentTime += skipAmount;
          }
        }, 1000 / 30); // Update 30 times per second
      }
      
      // Update UI
      document.querySelectorAll('.speedBtn').forEach(btn => {
        btn.classList.remove('active');
      });
      clickedBtn.classList.add('active');
      
      speedLabel.textContent = speed <= 16 
        ? `Speed: ${speed}x (native)` 
        : `Timelapse: ${speed}x (skip frames)`;
    }
    
    function startStream() {
      if (Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          manifestLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 30000,
          enableWorker: true
        });
        
        hls.loadSource(src);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.volume = 0;
          video.play().catch(err => console.error("Play failed:", err));
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS Error:", data.type, data.details);
          
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < maxRetries) {
              retryCount++;
              setTimeout(() => {
                hls.destroy();
                startStream();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            }
          }
        });
        
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.muted = true;
        video.volume = 0;
        video.play().catch(err => console.error("Play error:", err));
      }
    }
    
    video.addEventListener('volumechange', () => {
      if (!video.muted) video.muted = true;
      if (video.volume > 0) video.volume = 0;
    });
    
    // Clean up interval when paused
    video.addEventListener('pause', () => {
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
    });
    
    video.addEventListener('play', () => {
      if (currentSpeed > 16 && !timelapseInterval) {
        setSpeed(currentSpeed, document.querySelector('.speedBtn.active'));
      }
    });
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startStream);
    } else {
      startStream();
    }
  </script>
</body>
</html>
