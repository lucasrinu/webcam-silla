<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
    video::-webkit-media-controls-mute-button {
      display: none;
    }
    video::-webkit-media-controls-volume-slider {
      display: none;
    }
    
    #speedControls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      padding: 12px;
      border-radius: 5px;
      z-index: 1000;
      max-width: 300px;
    }
    .speedBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      margin: 3px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace;
    }
    .speedBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .speedBtn.active {
      background: rgba(0, 150, 255, 0.8);
      border-color: rgba(0, 150, 255, 1);
    }
    #streamInfo {
      color: white;
      font-family: monospace;
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.6;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 8px;
    }
    #speedLabel {
      color: white;
      font-family: monospace;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="speedControls">
    <div id="speedLabel">Speed Controls</div>
    <div id="speedButtons"></div>
    <div id="streamInfo">Loading...</div>
  </div>
  
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const speedButtons = document.getElementById("speedButtons");
    const speedLabel = document.getElementById("speedLabel");
    const streamInfo = document.getElementById("streamInfo");
    const src = "https://customer-rhnwzxvb3mg4wz3v.cloudflarestream.com/9670db1ec306039c0abc79ec5feb3e36/manifest/video.m3u8?parentOrigin=https%3A%2F%2Fcloudflare.tv";
    
    const speeds = [0.25, 0.5, 1, 2, 5, 10, 100, 500, 1000];
    let currentSpeed = 1;
    let timelapseInterval = null;
    let hls;
    let retryCount = 0;
    const maxRetries = 3;
    
    speeds.forEach(speed => {
      const btn = document.createElement('button');
      btn.className = 'speedBtn';
      btn.textContent = speed + 'x';
      btn.onclick = () => setSpeed(speed, btn);
      if (speed === 1) btn.classList.add('active');
      speedButtons.appendChild(btn);
    });
    
    function updateStreamInfo() {
      const duration = video.duration;
      const currentTime = video.currentTime;
      
      let info = '';
      
      // Check if live or VOD
      if (duration === Infinity) {
        info += '<strong>LIVE STREAM</strong><br>';
      } else if (!isNaN(duration) && duration > 0) {
        info += '<strong>VOD</strong><br>';
        info += `Duration: ${formatTime(duration)}<br>`;
      }
      
      // Check seekable range
      if (video.seekable.length > 0) {
        const seekStart = video.seekable.start(0);
        const seekEnd = video.seekable.end(0);
        const dvrWindow = seekEnd - seekStart;
        
        info += `Seekable: ${formatTime(dvrWindow)}<br>`;
        info += `Start: ${formatTime(seekStart)}<br>`;
        info += `End: ${formatTime(seekEnd)}<br>`;
        info += `Current: ${formatTime(currentTime)}<br>`;
      } else {
        info += 'No seekable range<br>';
      }
      
      // Buffered info
      if (video.buffered.length > 0) {
        const bufStart = video.buffered.start(0);
        const bufEnd = video.buffered.end(video.buffered.length - 1);
        info += `Buffered: ${formatTime(bufEnd - bufStart)}`;
      }
      
      streamInfo.innerHTML = info || 'No stream data available';
    }
    
    function formatTime(seconds) {
      if (!isFinite(seconds)) return 'N/A';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    }
    
    function setSpeed(speed, clickedBtn) {
      currentSpeed = speed;
      
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
      
      if (speed <= 16) {
        video.playbackRate = speed;
      } else {
        video.playbackRate = 1;
        const skipAmount = speed / 30;
        
        timelapseInterval = setInterval(() => {
          if (!video.paused && !video.ended) {
            const newTime = video.currentTime + skipAmount;
            
            // Stay within seekable range
            if (video.seekable.length > 0) {
              const maxSeek = video.seekable.end(0) - 2;
              video.currentTime = Math.min(newTime, maxSeek);
            } else {
              video.currentTime = newTime;
            }
          }
        }, 1000 / 30);
      }
      
      document.querySelectorAll('.speedBtn').forEach(btn => {
        btn.classList.remove('active');
      });
      clickedBtn.classList.add('active');
      
      speedLabel.textContent = speed <= 16 
        ? `Speed: ${speed}x` 
        : `Timelapse: ${speed}x`;
    }
    
    function startStream() {
      if (Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          manifestLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 30000,
          enableWorker: true
        });
        
        hls.loadSource(src);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.volume = 0;
          video.play().catch(err => console.error("Play failed:", err));
          
          // Force initial update
          setTimeout(updateStreamInfo, 500);
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < maxRetries) {
              retryCount++;
              setTimeout(() => {
                hls.destroy();
                startStream();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            }
          }
        });
        
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.muted = true;
        video.volume = 0;
        video.play().catch(err => console.error("Play error:", err));
      }
    }
    
    // Update info every second
    setInterval(updateStreamInfo, 1000);
    
    // Prevent seeking outside seekable range
    video.addEventListener('seeking', () => {
      if (video.seekable.length > 0) {
        const seekStart = video.seekable.start(0);
        const seekEnd = video.seekable.end(0);
        
        if (video.currentTime < seekStart) {
          console.log('Clamping to seekStart:', seekStart);
          video.currentTime = seekStart + 0.1; // Add small offset
        } else if (video.currentTime > seekEnd) {
          console.log('Clamping to seekEnd:', seekEnd);
          video.currentTime = seekEnd - 1;
        }
      }
    });
    
    video.addEventListener('loadedmetadata', updateStreamInfo);
    video.addEventListener('timeupdate', updateStreamInfo);
    
    video.addEventListener('volumechange', () => {
      if (!video.muted) video.muted = true;
      if (video.volume > 0) video.volume = 0;
    });
    
    video.addEventListener('pause', () => {
      if (timelapseInterval) {
        clearInterval(timelapseInterval);
        timelapseInterval = null;
      }
    });
    
    video.addEventListener('play', () => {
      if (currentSpeed > 16 && !timelapseInterval) {
        setSpeed(currentSpeed, document.querySelector('.speedBtn.active'));
      }
    });
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startStream);
    } else {
      startStream();
    }
  </script>
</body>
</html>
