<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
    }
    video::-webkit-media-controls-mute-button {
      display: none;
    }
    video::-webkit-media-controls-volume-slider {
      display: none;
    }
    
    /* Speed controls overlay */
    #speedControls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
    }
    .speedBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      margin: 3px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace;
    }
    .speedBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .speedBtn.active {
      background: rgba(0, 150, 255, 0.8);
      border-color: rgba(0, 150, 255, 1);
    }
  </style>
</head>
<body>
  <div id="speedControls"></div>
  
  <video
    id="video"
    controls
    muted
    playsinline
    style="background:black">
  </video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const speedControls = document.getElementById("speedControls");
    const src = "https://customer-rhnwzxvb3mg4wz3v.cloudflarestream.com/9670db1ec306039c0abc79ec5feb3e36/manifest/video.m3u8?parentOrigin=https%3A%2F%2Fcloudflare.tv";
    const speeds = [0.25, 0.5, 1, 2, 5, 10, 100, 500, 1000];
    let hls;
    let retryCount = 0;
    const maxRetries = 3;
    
    // Create speed buttons
    speeds.forEach(speed => {
      const btn = document.createElement('button');
      btn.className = 'speedBtn';
      btn.textContent = speed + 'x';
      btn.onclick = () => setSpeed(speed, btn);
      if (speed === 1) btn.classList.add('active');
      speedControls.appendChild(btn);
    });
    
    function setSpeed(speed, clickedBtn) {
      video.playbackRate = speed;
      
      // Update active button
      document.querySelectorAll('.speedBtn').forEach(btn => {
        btn.classList.remove('active');
      });
      clickedBtn.classList.add('active');
    }
    
    function startStream() {
      if (Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          manifestLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 30000,
          enableWorker: true
        });
        
        hls.loadSource(src);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.volume = 0;
          video.play().catch(err => console.error("Play failed:", err));
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS Error:", data.type, data.details);
          
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < maxRetries) {
              console.log("Network error, retrying... (" + (retryCount + 1) + "/" + maxRetries + ")");
              retryCount++;
              setTimeout(() => {
                hls.destroy();
                startStream();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              console.log("Media error, attempting recovery");
              hls.recoverMediaError();
            }
          }
        });
        
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.muted = true;
        video.volume = 0;
        video.play().catch(err => console.error("Play error:", err));
      }
    }
    
    video.addEventListener('volumechange', () => {
      if (!video.muted) video.muted = true;
      if (video.volume > 0) video.volume = 0;
    });
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startStream);
    } else {
      startStream();
    }
  </script>
</body>
</html>
