<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;      /* 🚫 disables scrolling */
      background: black;
    }

    #container {
      position: fixed;
      inset: 0;              /* top:0 right:0 bottom:0 left:0 */
      overflow: hidden;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* or cover — see below */
      background: black;
      display: block;
    }

    button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" controls muted playsinline></video>
  <button id="play">▶ Start Stream</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById("video");
  const btn = document.getElementById("play");
  const src = "https://716f898c7b71.entrypoint.cloud.wowza.com/app-8F9K44lJ/304679fe_stream2/playlist.m3u8";

  btn.onclick = () => {
    btn.style.display = "none";
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
      video.play();
    } else {
      video.src = src;
      video.play();
    }
  };
</script>

</body>
</html>
